name: release-check

# 提 PR 到 main：校验技能版本一致性；
# 打 v* tag：校验「全部技能 version == tag 版本」，通过后自动建 GitHub Release。
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 校验技能版本一致性
        run: node scripts/check-release.mjs
      - name: 校验 tag 与技能版本匹配
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-release.mjs --expected="${GITHUB_REF_NAME#v}"
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
